<svg xmlns="http://www.w3.org/2000/svg" width="440" height="226" viewBox="0 0 440 226" role="img" aria-label="Top programming languages across public repositories">
  <title>Top programming languages across public repositories</title>
  <style>
  .sans { font-family: 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', 'Courier New', monospace; }
  .title { font: 600 13px 'JetBrains Mono', 'Fira Code', Consolas, monospace; fill: #22d3ee; letter-spacing: 0.5px; }
  .label { font: 400 13px 'Segoe UI', Inter, Roboto, Arial, sans-serif; fill: #9ca3af; }
  .value { font: 700 26px 'Segoe UI', Inter, Roboto, Arial, sans-serif; fill: #f3f4f6; }
  .big { font: 800 42px 'Segoe UI', Inter, Roboto, Arial, sans-serif; }
  .small { font: 400 12px 'JetBrains Mono', Consolas, monospace; fill: #6b7280; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s ease-out both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .grow { animation: none; } }
</style>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="439" height="225" rx="14" fill="#0a0a12" stroke="#2d2550"/>
  <rect x="24" y="0" width="392" height="2" fill="url(#accent)" opacity="0.8"/>
  <text class="title" x="24" y="36">TOP LANGUAGES</text>
  <rect x="24" y="58" width="392" height="12" rx="6" fill="#17152b"/>
  <rect class="grow" x="24.00" y="58" width="268.76" height="12" fill="#3178c6" style="animation-delay: 0.0s"/><rect class="grow" x="292.76" y="58" width="110.00" height="12" fill="#3572a5" style="animation-delay: 0.1s"/><rect class="grow" x="402.76" y="58" width="9.50" height="12" fill="#f1e05a" style="animation-delay: 0.2s"/><rect class="grow" x="412.26" y="58" width="3.27" height="12" fill="#a855f7" style="animation-delay: 0.3s"/><rect class="grow" x="415.53" y="58" width="2.00" height="12" fill="#60a5fa" style="animation-delay: 0.4s"/>
  <circle cx="29" cy="98" r="5" fill="#3178c6"/>
