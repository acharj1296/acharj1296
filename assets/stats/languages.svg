  <text class="small" x="194" y="102" text-anchor="end" style="fill: #9ca3af">68.6%</text>
  <circle cx="229" cy="98" r="5" fill="#3572a5"/>
  <text class="label" x="242" y="102" style="fill: #e5e7eb">Python</text>
  <text class="small" x="394" y="102" text-anchor="end" style="fill: #9ca3af">28.1%</text>
  <circle cx="29" cy="128" r="5" fill="#f1e05a"/>
  <text class="label" x="42" y="132" style="fill: #e5e7eb">JavaScript</text>
  <text class="small" x="194" y="132" text-anchor="end" style="fill: #9ca3af">2.4%</text>
