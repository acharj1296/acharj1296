<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="Decorative separator">
  <title>Decorative separator</title>
  <defs>
    <linearGradient id="d-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <style>
    .flow { stroke-dasharray: 18 12; animation: flow 4s linear infinite; }
    @keyframes flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -300; }
    }
    .node { transform-box: fill-box; transform-origin: center; animation: node 3s ease-in-out infinite; }
    @keyframes node {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <line x1="0" y1="14" x2="1200" y2="14" stroke="#1f1a33" stroke-width="1"/>
  <line class="flow" x1="0" y1="14" x2="1200" y2="14" stroke="url(#d-flow)" stroke-width="2" stroke-linecap="round"/>
  <circle class="node" cx="150" cy="14" r="3" fill="#a855f7"/>
  <circle class="node" cx="600" cy="14" r="3.5" fill="#22d3ee" style="animation-delay: 1s"/>
  <circle class="node" cx="1050" cy="14" r="3" fill="#34d399" style="animation-delay: 2s"/>
</svg>
